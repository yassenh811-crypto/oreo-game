<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل لعبة أوريو - Oreo Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1d1f27, #3b4252);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 480px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffcc00;
        }
        p {
            font-size: 16px;
            color: #d8dee9;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .download-btn {
            display: block;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 15px;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
        .download-btn.pc {
            background-color: #0078D7;
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة أوريو 🍪</h1>
        <p>استمتع باللعب الآن! اختر النسخة المناسبة لجهازك للتحميل المباشر:</p>
        
        <!-- زر تحميل الأندرويد المباشر (بالرابط الجديد) -->
        <a href="https://drive.usercontent.google.com/download?id=1oj6Es3DomrvooYm0n7oX1VJzLiAfKx8h&export=download&confirm=t" class="download-btn">
            تحميل نسخة الأندرويد (APK) 📱
        </a>

        <!-- زر تحميل الويندوز المباشر (الملف المضغوط ZIP) -->
        <a href="https://drive.usercontent.google.com/download?id=1zCg0K29M7feuqHx5UocBNssK2Tu1Riws&export=download&confirm=t" class="download-btn pc">
            تحميل نسخة الويندوز (PC ZIP) 💻
        </a>

        <div class="footer">متوافق مع الهواتف وأجهزة الكمبيوتر</div>
    </div>

</body>
</html>
